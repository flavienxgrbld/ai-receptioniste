version: "3.9"

services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "curl -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{\"name\":\"phi3:mini\"}' --max-time 300"]
    restart: no

  ai-service:
    image: ghcr.io/flavienxgrbld/ai-receptioniste-ai-service:latest
    container_name: ai-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - MODEL_NAME=${MODEL_NAME}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-service:
    image: ghcr.io/flavienxgrbld/ai-receptioniste-chat-service:latest
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - AI_SERVICE_URL=http://ai-service:5000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      ai-service:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  voice-service:
    image: ghcr.io/flavienxgrbld/ai-receptioniste-voice-service:latest
    container_name: voice-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - AI_SERVICE_URL=http://ai-service:5000
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    image: ghcr.io/flavienxgrbld/ai-receptioniste-gateway:latest
    container_name: gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - CHAT_SERVICE_URL=http://chat-service:5001
      - VOICE_SERVICE_URL=http://voice-service:5002
    depends_on:
      chat-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/flavienxgrbld/ai-receptioniste-frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d receptionist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ollama_data:
  db_data: