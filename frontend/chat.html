<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat — Réceptionniste IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --border: #e4e2db;
      --text: #1a1a18;
      --muted: #7a7870;
      --accent: #1a4f8a;
      --accent-light: #e8f0fa;
      --green: #1a6b4a;
      --green-light: #e6f4ee;
      --radius: 14px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }

    .back-btn:hover { background: var(--bg); color: var(--text); }

    .header-sep { width: 1px; height: 20px; background: var(--border); }

    .header-info { display: flex; align-items: center; gap: 10px; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--accent);
      flex-shrink: 0;
    }

    .header-name { font-size: 0.9rem; font-weight: 500; }
    .header-role { font-size: 0.75rem; color: var(--muted); }

    .online-badge {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 0.75rem;
      color: var(--green);
    }

    .online-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .date-sep {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      margin: 0.5rem 0;
    }

    .msg-row { display: flex; gap: 10px; align-items: flex-end; }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--accent);
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .msg-content { display: flex; flex-direction: column; gap: 3px; max-width: 70%; }
    .msg-row.user .msg-content { align-items: flex-end; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .msg-row.ai .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .msg-row.user .msg-bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 0.68rem;
      color: var(--muted);
      padding: 0 4px;
    }

    .typing-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: typingBounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); background: var(--accent); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row { animation: fadeIn 0.2s ease; }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      padding: 0.65rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: var(--muted); }

    #send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }

    #send-btn:hover { opacity: 0.85; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn svg { width: 16px; height: 16px; fill: white; }

    #send-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

<header>
  <a class="back-btn" href="index.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    Accueil
  </a>
  <div class="header-sep"></div>
  <div class="header-info">
    <div class="avatar">IA</div>
    <div>
      <div class="header-name">Réceptionniste</div>
      <div class="header-role">Assistant virtuel</div>
    </div>
  </div>
  <div class="online-badge">
    <div class="online-dot"></div>
    En ligne
  </div>
</header>

<div id="messages">
  <div class="date-sep">Aujourd'hui</div>
  <div class="msg-row ai">
    <div class="msg-avatar">IA</div>
    <div class="msg-content">
      <div class="msg-bubble">Bonjour ! Je suis votre réceptionniste virtuel. Comment puis-je vous aider aujourd'hui ?</div>
      <div class="msg-time" id="init-time"></div>
    </div>
  </div>
</div>

<footer>
  <input type="text" id="input" placeholder="Écrivez votre message…" autocomplete="off"/>
  <button id="send-btn" onclick="send()">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
  </button>
</footer>

<script>
  document.getElementById('init-time').textContent = now();

  const input = document.getElementById('input');
  const messages = document.getElementById('messages');
  const sendBtn = document.getElementById('send-btn');

  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

  function now() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(text, role) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;

    if (role === 'ai') {
      row.innerHTML = `
        <div class="msg-avatar">IA</div>
        <div class="msg-content">
          <div class="msg-bubble">${escHtml(text)}</div>
          <div class="msg-time">${now()}</div>
        </div>`;
    } else {
      row.innerHTML = `
        <div class="msg-content">
          <div class="msg-bubble">${escHtml(text)}</div>
          <div class="msg-time">${now()}</div>
        </div>`;
    }

    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="msg-avatar">IA</div>
      <div class="msg-content">
        <div class="typing-bubble">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>`;
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-row');
    if (t) t.remove();
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  async function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    sendBtn.disabled = true;

    addMessage(text, 'user');
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.response || 'Pas de réponse.', 'ai');
    } catch {
      removeTyping();
      addMessage('Erreur de connexion. Veuillez réessayer.', 'ai');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
