server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Proxy API chat vers la gateway
    location /api/chat {
        proxy_pass http://gateway:3000/chat/chat;
        proxy_set_header Content-Type application/json;
    }

    # Proxy API voice vers la gateway
    location /api/voice {
        proxy_pass http://gateway:3000/voice/voice;
        proxy_read_timeout 120s;
    }

    # Proxy audio TTS
    location /api/audio {
        proxy_pass http://gateway:3000/audio;
    }
}
